version: '3.8'

services:
  db:
    image: postgres:16
    container_name: opspilot-postgres
    environment:
      POSTGRES_USER: opspilot_user
      POSTGRES_PASSWORD: opspilot_password
      POSTGRES_DB: opspilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot_user -d opspilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: opspilot-redis
    ports:
      - "6379:6379"

  api:
    build: ./backend
    container_name: opspilot-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://opspilot_user:opspilot_password@db:5432/opspilot_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    container_name: opspilot-worker
    command: ["celery", "-A", "app.celery_worker.celery_app", "worker", "-B", "--loglevel=info"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://opspilot_user:opspilot_password@db:5432/opspilot_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
